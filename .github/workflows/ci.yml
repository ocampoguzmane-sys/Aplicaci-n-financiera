name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Dirección del servidor que usarán las apps compiladas (https://…)'
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.6'
  # Dirección del servidor para las apps: variable del repositorio API_URL, o la indicada al lanzar el flujo a mano.
  API_URL: ${{ inputs.api_url || vars.API_URL }}

jobs:
  backend:
    name: Backend (tipos y pruebas)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  app:
    name: App (análisis y pruebas)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  contenedor:
    name: Imagen web + servidor (Docker)
    needs: [backend, app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # La imagen compila la web con Flutter dentro: es la misma que se publica.
      - name: Construir la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: financiera:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Arrancar y verificar
        run: |
          docker run -d --name financiera -p 3000:3000 \
            -e JWT_SECRET="$(head -c 36 /dev/urandom | base64)" \
            -e ADMIN_CODIGO=1001 -e ADMIN_EMPRESA="Empresa de prueba" \
            -e ADMIN_USUARIO=admin -e ADMIN_NOMBRE="Administrador" -e ADMIN_CLAVE=Clave2026seg \
            financiera:ci
          for i in $(seq 1 30); do curl -fs localhost:3000/salud >/dev/null && break; sleep 1; done
          scripts/prueba-humo.sh http://localhost:3000 1001 admin Clave2026seg
      - name: El servidor no corre como administrador del sistema
        run: |
          uid="$(docker exec financiera sh -c "awk '/^Uid:/ {print \$2}' /proc/1/status")"
          echo "uid del proceso: $uid"
          test "$uid" != "0"
      - name: Registro del contenedor (si algo falló)
        if: failure()
        run: docker logs financiera

  android:
    name: Android (APK y AAB)
    needs: app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    # Firma de producción (opcional): si existen estos secretos, el APK/AAB se firman con tu clave.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Preparar la firma
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=API_URL=${{ env.API_URL }}
      - run: flutter build appbundle --release --dart-define=API_URL=${{ env.API_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/bundle/release/app-release.aab

  windows:
    name: Windows
    needs: app
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release --dart-define=API_URL=${{ env.API_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: app/build/windows/x64/runner/Release/

  ios:
    name: iOS (sin firmar)
    needs: app
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # Se compila sin firmar: para publicar en la App Store hay que firmar con una cuenta de Apple Developer (ver docs/despliegue.md).
      - run: flutter build ios --release --no-codesign --dart-define=API_URL=${{ env.API_URL }}
      - run: |
          cd build/ios/iphoneos
          zip -qry Runner.app.zip Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: ios-sin-firmar
          path: app/build/ios/iphoneos/Runner.app.zip
